<style>
:root{
  --night:#0B2415;--forest:#154029;--leaf:#8EC63F;--green:#27A749;--amber:#FBB028;--orange:#F58A1E;--brand:#F26B21;
  --cream:#FFF4E3;--coffee:#3A1C0A;--ice:#E2F2F0;--burnt:#B84A0B;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Lato',system-ui,-apple-system,'Segoe UI',sans-serif;--hand:'Caveat','Segoe Script','Bradley Hand',cursive;
  --pad:clamp(20px,5.5vw,84px);--max:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--coffee);font:400 1.0625rem/1.6 var(--sans);overflow-x:hidden;position:relative;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
img{height:auto}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.d{font-family:var(--serif);font-variation-settings:'opsz' 144,'SOFT' 60,'WONK' 1;font-optical-sizing:none;letter-spacing:-.025em;line-height:.98}
.d em{font-style:italic;font-variation-settings:'opsz' 144,'SOFT' 100,'WONK' 1}
.hand{font-family:var(--hand);font-weight:700;line-height:1}
.kick{font:900 .78rem/1.2 var(--sans);letter-spacing:.24em;text-transform:uppercase}
.wrap{position:relative;z-index:3;max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
section{position:relative}
.cut{overflow:clip}
.big{position:absolute;z-index:1;font-family:var(--serif);font-variation-settings:'opsz' 144,'SOFT' 100,'WONK' 1;font-weight:900;line-height:.8;white-space:nowrap;pointer-events:none;user-select:none;letter-spacing:-.04em}
.wave{position:absolute;left:0;width:100%;height:clamp(46px,7.5vw,120px);z-index:1;pointer-events:none}
.wave.top{top:-1px}.wave.bot{bottom:-1px}
.va{position:absolute;width:2px;height:2px;pointer-events:none;visibility:hidden}
.va.m{display:none}
@media(max-width:899px){.va.d{display:none}.va.m{display:block}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;min-height:50px;padding:.7em 1.5em;border-radius:99px;font:900 .98rem/1 var(--sans);letter-spacing:.02em;text-decoration:none;cursor:pointer;border:2.5px solid transparent;transition:transform .25s cubic-bezier(.2,.9,.3,1.4),background .2s,color .2s}
.btn:hover{transform:translateY(-3px) rotate(-1deg)}
.btn.or{background:var(--brand);color:#fff;color:#1d0d03;background:var(--amber)}
.btn.cf{background:var(--coffee);color:var(--cream)}
.btn.ln{border-color:currentColor;background:transparent}
.btn svg{width:1.1em;height:1.1em}
/* reveal */
.js .rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.js .rv.l{transform:translateX(-50px)}.js .rv.r{transform:translateX(50px)}.js .rv.s{transform:scale(.86) rotate(-3deg)}
.js .rv.in{opacity:1;transform:none}
/* NAV */
.nav{position:fixed;z-index:60;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.nav>*{pointer-events:auto}
.nav .lg{background:var(--coffee);border-radius:99px;padding:9px 20px;display:flex;align-items:center;min-height:44px}
.nav .lg img{height:22px;width:auto}
.nav .rt{display:flex;gap:8px;align-items:center}
.nav .lk{display:none;background:var(--coffee);border-radius:99px;padding:0 6px;min-height:44px;align-items:center}
.nav .lk a{color:var(--cream);text-decoration:none;font:700 .86rem var(--sans);padding:12px 12px;border-radius:99px;min-height:44px;display:inline-flex;align-items:center}
.nav .lk a:hover{background:rgba(255,244,227,.14)}
.nav .imp{background:var(--amber);color:#1d0d03;border-radius:99px;min-height:44px;padding:0 18px;display:inline-flex;align-items:center;text-decoration:none;font:900 .86rem var(--sans)}
.lang{display:inline-flex;background:var(--coffee);border-radius:99px;padding:3px}
.lang button{min-width:44px;min-height:44px;border:0;background:none;color:var(--cream);font:900 .8rem var(--sans);border-radius:99px;cursor:pointer;letter-spacing:.06em}
.lang button[aria-pressed=true]{background:var(--amber);color:#1d0d03}
.demo{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;white-space:nowrap;z-index:60;background:rgba(58,28,10,.86);color:var(--cream);font:700 .7rem var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;border-radius:99px}
@media(min-width:900px){.nav .lk{display:flex}}
.nav .mb{width:44px;height:44px;border:0;border-radius:99px;background:var(--coffee);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.nav .mb i{display:block;width:18px;height:2.5px;border-radius:2px;background:var(--cream);transition:transform .25s,opacity .2s}
.nav .mb[aria-expanded=true] i:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.nav .mb[aria-expanded=true] i:nth-child(2){opacity:0}
.nav .mb[aria-expanded=true] i:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
.nav .mn{position:absolute;top:56px;left:0;right:0;background:var(--coffee);border-radius:22px;padding:8px;display:flex;flex-direction:column;box-shadow:0 18px 40px -12px rgba(0,0,0,.5);pointer-events:auto}
.nav .mn[hidden]{display:none}
.nav .mn a{color:var(--cream);text-decoration:none;font:700 1.05rem var(--sans);padding:0 18px;min-height:50px;display:flex;align-items:center;border-radius:14px}
.nav .mn a:hover,.nav .mn a:focus-visible{background:rgba(255,244,227,.14)}
@media(min-width:900px){.nav .mb,.nav .mn{display:none}}
@media(max-width:899px){
  .nav .lang button[aria-pressed=true]{display:none}
  .nav .lg{padding:9px 14px}.nav .lg img{height:19px}
  .nav .imp{padding:0 14px;font-size:.82rem}
  .nav .rt{gap:6px}
}
@media(max-width:380px){.nav .lg{padding:9px 11px}.nav .lg img{height:16px}.nav .imp{padding:0 11px;font-size:.76rem}.nav .rt{gap:4px}}
/* VINE */
#vine{position:absolute;left:0;top:0;width:100%;z-index:2;pointer-events:none;overflow:visible}
#vine .lf{transform-box:fill-box;transform-origin:0 50%;transition:transform .7s cubic-bezier(.2,1.5,.4,1),opacity .5s}
#vine .lf{opacity:0;transform:scale(.01)}
#vine .lf.on{opacity:1;transform:scale(1)}
#endFruit{position:absolute;z-index:3;width:66px;height:82px;margin:-6px 0 0 -33px;transform:scale(0);transform-origin:50% 0;transition:transform .9s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
#endFruit.on{transform:scale(1)}
/* ===== HERO ===== */
.hero{background:radial-gradient(120% 90% at 78% 8%,#1d5a35 0%,#154029 38%,var(--night) 78%);color:var(--cream);min-height:max(100svh,640px);padding:clamp(84px,12vh,130px) 0 clamp(90px,12vw,170px);display:flex;flex-direction:column;justify-content:center}
.hero .big{left:-3vw;bottom:clamp(14px,3vw,48px);font-size:clamp(5rem,21.5vw,17rem);color:transparent;-webkit-text-stroke:2px rgba(142,198,63,.3);opacity:.9}
.hero-in{position:relative;z-index:4;max-width:var(--max);margin:0 auto;padding:0 var(--pad);width:100%}
.hero h1{font-size:clamp(2.9rem,5vw,5.2rem);margin:.22em 0 .3em;max-width:7.8em}
.hero h1 em{color:var(--amber)}
.hero .kick{color:var(--leaf)}
.hero .lead{max-width:34em;font-size:clamp(1rem,1.5vw,1.18rem);color:rgba(255,244,227,.9)}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero .hp{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;max-width:36em}
.hero .hp a{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:99px;border:1.5px solid rgba(255,244,227,.38);color:var(--cream);text-decoration:none;font:700 .86rem var(--sans);background:rgba(255,244,227,.07);transition:background .2s,border-color .2s}
.hero .hp a:hover{background:rgba(251,176,40,.22);border-color:var(--amber)}
.hero .tag{position:relative;z-index:5;display:inline-block;margin-top:22px;color:var(--amber);font-size:clamp(1.5rem,3vw,2.3rem);transform:rotate(-2deg)}
.hero .tag svg{width:120px;height:26px;margin-top:2px}
.tree{position:absolute;z-index:3;right:0;top:0;width:min(54vw,760px);height:min(100%,640px);pointer-events:none}
.tree svg{width:100%;height:100%}
.swing{animation:swing 5.2s ease-in-out infinite;transform-origin:var(--ox) var(--oy)}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4.5deg)}}
.hero .fgl{position:absolute;z-index:2;pointer-events:none;will-change:transform;transform:translate3d(0,calc(var(--sy,0)*var(--k)*1px),0)}
.hero .tree{transform:translate3d(0,calc(var(--sy,0)*.1px),0)}
[id]{scroll-margin-top:84px}
.ff{position:absolute;z-index:3;width:6px;height:6px;border-radius:50%;background:#e7ff9a;box-shadow:0 0 12px 4px rgba(190,255,90,.55);animation:ff 7s ease-in-out infinite;opacity:0}
@keyframes ff{0%,100%{opacity:0;transform:translate(0,0)}30%{opacity:.95}60%{opacity:.5;transform:translate(24px,-34px)}80%{opacity:.9}}
.cue{position:absolute;z-index:5;right:var(--pad);bottom:clamp(30px,5vw,70px);display:none;align-items:center;gap:10px;color:var(--leaf);font-size:1.5rem}
.cue i{display:block;width:2px;height:46px;background:linear-gradient(var(--leaf),transparent);animation:cue 2.2s ease-in-out infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
@media(max-width:899px){
  .hero{justify-content:flex-start;padding-top:96px}
  .tree{position:relative;width:calc(100% + 40px);margin:-8px -20px 0 0;height:300px;order:-1;align-self:flex-end}
}
@media(min-width:900px){.cue{display:flex}}
/* ===== COSECHA ===== */
.cos{background:linear-gradient(180deg,#154029 0,#5d3a14 9%,#E87A18 24%,var(--amber) 52%,#FDDC9A 80%,var(--cream) 100%);padding:clamp(100px,14vw,200px) 0 clamp(80px,10vw,150px)}
.cos .big{right:-4vw;top:clamp(110px,15vw,210px);font-size:clamp(5rem,25vw,23rem);color:rgba(255,244,227,.2)}
.sun{position:absolute;z-index:1;left:50%;top:6%;width:min(74vw,720px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#FFE9A8 0,#FBB028 46%,rgba(251,176,40,0) 70%);transform:translate(-50%,calc(var(--sun,0)*1px));opacity:.85}
.cos-g{display:grid;gap:28px}
.cos-t .kick{color:var(--coffee)}
.cos-t h2{font-size:clamp(2.5rem,6vw,5.2rem);margin:.3em 0 .5em;color:var(--coffee)}
.cos-t h2 em{color:var(--cream);-webkit-text-stroke:2.5px var(--coffee);paint-order:stroke fill}
.cos-t p{max-width:24em;font-size:1.12rem}
.cos-t .pq{font-size:clamp(1.3rem,2.4vw,1.9rem);margin-top:1.2em;font-style:italic;font-family:var(--serif);font-variation-settings:'opsz' 72,'SOFT' 100;line-height:1.2;max-width:15em}
.cos-pic{position:relative;margin-top:10px}
.blob{position:relative;aspect-ratio:4/3.1;border-radius:58% 42% 47% 53%/60% 44% 56% 40%;overflow:hidden;box-shadow:0 30px 60px -20px rgba(58,28,10,.55);transform:rotate(-2.2deg);animation:morph 14s ease-in-out infinite}
.blob img{width:100%;height:100%;object-fit:cover;object-position:80% 50%;transform:scale(var(--z,1.05))}
@keyframes morph{0%,100%{border-radius:58% 42% 47% 53%/60% 44% 56% 40%}50%{border-radius:46% 54% 55% 45%/48% 58% 42% 52%}}
.lens{position:absolute;width:clamp(92px,20vw,168px);aspect-ratio:1;border-radius:50%;border:5px solid var(--cream);box-shadow:0 14px 30px rgba(58,28,10,.4);background:url(../assets/cosecha.jpg) no-repeat;background-size:700% auto;background-position:46.5% 68%;left:-4%;bottom:-6%;z-index:3}
.note{position:absolute;z-index:4;color:var(--coffee);font-size:clamp(1.25rem,2.4vw,1.75rem);display:flex;align-items:center;gap:6px;white-space:nowrap}
.note svg{width:64px;height:44px;flex:none;stroke:var(--coffee);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.note.n1{top:-6%;right:8%;transform:rotate(3deg)}
.note.n2{top:44%;right:-2%;transform:rotate(-4deg);flex-direction:row-reverse}
.note.n3{bottom:-9%;right:24%;transform:rotate(2deg)}
.note.n4{top:6%;left:2%;transform:rotate(-5deg);color:#fff;text-shadow:0 1px 8px rgba(58,28,10,.7)}
.note.n4 svg{stroke:#fff}
.joya{margin-top:clamp(90px,12vw,170px);display:grid;gap:22px;align-items:center}
.joya h3{font-size:clamp(2.2rem,5vw,4rem);color:var(--coffee)}
.joya h3 em{color:var(--burnt)}
.joya p{max-width:30em}
.stk{display:flex;flex-wrap:wrap;gap:10px 8px;align-items:center}
.stk span{display:inline-flex;align-items:center;font-weight:900;padding:.55em 1.2em;color:var(--coffee);background:var(--cream);border:2.5px solid var(--coffee);min-height:44px}
.stk span:nth-child(1){border-radius:60% 40% 55% 45%/50% 60% 40% 50%;transform:rotate(-4deg);background:var(--leaf)}
.stk span:nth-child(2){border-radius:99px;transform:rotate(3deg);font-size:1.15rem;margin-left:6px;background:var(--amber)}
.stk span:nth-child(3){border-radius:40% 60% 45% 55%/55% 40% 60% 45%;transform:rotate(-2deg);margin-top:8px}
.stk span:nth-child(4){border-radius:99px;transform:rotate(5deg);background:#fff}
.stk span:nth-child(5){border-radius:55% 45% 60% 40%/45% 55% 45% 55%;transform:rotate(-3deg);background:var(--leaf);margin-left:10px}
@media(min-width:900px){
  .cos-g{grid-template-columns:5fr 7fr;gap:0;align-items:center}
  .cos-pic{margin-right:-13vw;margin-left:2vw;margin-top:60px}
  .joya{grid-template-columns:1fr 1.15fr;gap:60px;margin-top:clamp(120px,12vw,190px)}
  .joya .stk{transform:translateY(14px)}
}
@media(max-width:899px){.note{font-size:1.2rem}.note.n4{display:none}.note.n2{right:2%}.cos-pic{margin:20px -6px 0 0}.note svg{width:44px}}
/* ===== FRIO ===== */
.frio{background:linear-gradient(180deg,var(--ice) 0,#CFE9EC 100%);padding:clamp(100px,13vw,190px) 0 clamp(90px,11vw,150px);color:#12363B}
.frio .big{left:-2vw;top:clamp(80px,10vw,150px);font-size:clamp(5rem,23vw,21rem);color:transparent;-webkit-text-stroke:2px rgba(18,54,59,.12)}
.frio-g{display:grid;gap:10px}
.frio-t{display:contents}.frio-t>.kick{order:0}.frio-t>h2{order:1}.frio-art{order:2}.beat{order:3}
.frio-art{position:sticky;top:64px;z-index:5;height:min(38svh,330px);background:linear-gradient(180deg,#e7f4f2 70%,rgba(231,244,242,0));margin:0 calc(var(--pad)*-1);padding:0 var(--pad)}
.frio-art svg{height:100%;width:auto;margin:0 auto;overflow:visible}
.frio-t .kick{color:#0e6d66}
.frio-t h2{font-size:clamp(2.6rem,6.4vw,5.6rem);margin:.3em 0 .8em;color:#12363B}
.frio-t h2 em{color:#0e7a8a}
.beat{padding:clamp(40px,12vh,130px) 0;opacity:.5;transition:opacity .5s}
.beat.on{opacity:1}
.beat h3{font-size:clamp(1.9rem,4vw,3.2rem);color:#12363B;margin-bottom:.4em}
.beat p{max-width:26em;font-size:1.12rem}
.beat .meta{display:inline-block;margin-top:14px;font:700 1.45rem var(--hand);color:#0e6d66;transform:rotate(-2deg)}
@media(min-width:900px){
  .frio-t{display:block}.frio-art{order:0}
  .frio-g{grid-template-columns:1fr 1fr;gap:70px;align-items:start}
  .frio-art{top:11vh;height:min(72svh,560px);margin:0;padding:0;background:none;order:0;align-self:start}
  .frio-t h2{margin-bottom:0}
  .beat{padding:clamp(70px,22vh,220px) 0}
  .beat:first-of-type{padding-top:12vh}
}
/* ===== PRODUCTOS ===== */
.prod{background:linear-gradient(180deg,var(--cream) 0,#FFE7C2 100%);padding:clamp(100px,12vw,180px) 0 clamp(100px,12vw,170px)}
.prod-h{display:grid;gap:22px;margin-bottom:clamp(40px,7vw,90px)}
.prod-h .kick{color:var(--burnt)}
.prod-h h2{font-size:clamp(2.6rem,6.6vw,5.8rem);max-width:11em}
.prod-h h2 em{color:var(--brand)}
.tg{display:inline-flex;background:var(--coffee);border-radius:99px;padding:4px;width:max-content}
.tg button{min-height:46px;padding:0 22px;border:0;border-radius:99px;background:none;color:var(--cream);font:900 .95rem var(--sans);cursor:pointer;transition:background .25s,color .25s}
.tg button[aria-pressed=true]{background:var(--amber);color:#1d0d03}
.tgn{font-size:1rem;max-width:30em;opacity:.9}
.pr{position:relative;display:grid;gap:18px;margin-bottom:clamp(70px,9vw,130px)}
.pr .nm{font-size:clamp(2rem,4.4vw,3.6rem)}
.pr .meta{font:700 1.4rem var(--hand);color:var(--burnt);transform:rotate(-2deg);display:inline-block}
.pr .pz{font-weight:900;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px}
.pr .pz::before{content:"";width:22px;height:2.5px;background:currentColor}
.pr .acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.pr .txt p{max-width:25em}
.pr .fig{position:relative}
.halo{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,rgba(251,176,40,.8) 0,rgba(251,176,40,0) 66%);z-index:0}
.pr .fig img.ph{position:relative;z-index:1;width:100%;filter:drop-shadow(0 24px 24px rgba(58,28,10,.28));animation:floaty 7s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-12px) rotate(1.5deg)}}
.pr .bw{font-size:clamp(5rem,19vw,16rem);z-index:0;color:transparent;-webkit-text-stroke:2px rgba(242,107,33,.4);top:-6%}
.pr1 .bw{left:-6vw}.pr2 .bw{right:-6vw;-webkit-text-stroke-color:rgba(39,167,73,.4);top:6%}
.sit{position:absolute;z-index:3;width:clamp(62px,9vw,100px);left:30%;bottom:76%;transform-origin:50% 100%;animation:sit 3.4s ease-in-out infinite}
@keyframes sit{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-8px)}}
.pr1 .bal{position:absolute;z-index:4;left:46%;bottom:calc(76% + 96px);font-size:1.4rem;color:var(--coffee);background:#fff;border:2.5px solid var(--coffee);border-radius:20px 20px 20px 4px;padding:6px 14px;transform:rotate(3deg) scale(0);transform-origin:20% 100%;transition:transform .6s cubic-bezier(.2,1.6,.4,1) .4s}
.pr1.in .bal,.pr1 .bal.on{transform:rotate(3deg) scale(1)}
.duo{display:grid;gap:60px;margin-bottom:0}
.blb{position:relative;padding:clamp(34px,5vw,60px) clamp(26px,4vw,52px) clamp(40px,5vw,60px)}

  var io2=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle('on',e.isIntersecting)})},{rootMargin:'-42% 0px -42% 0px'});
  $$('.beat').forEach(function(e){io2.observe(e)});
}else{$$('.rv').forEach(function(e){e.classList.add('in')})}
